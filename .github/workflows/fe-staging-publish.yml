name: Publish Frontend-staging
run-name: "Staging Publish: ${{ github.ref_name }} (${{ github.actor }})"

# main에 포함된 커밋의 staging 태그로 이미지만 빌드하고 발행
on:
  push:
    tags:
      - "staging-v*.*.*"

concurrency:
  group: fe-staging-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Docker Image 빌드 및 GHCR Push
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate staging tag on main
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^staging-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::스테이징 이미지 태그는 staging-vMAJOR.MINOR.PATCH 형식이어야 합니다"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::main에 포함된 커밋의 태그만 스테이징 이미지로 발행할 수 있습니다"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 메타데이터(태그/라벨) 생성
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.authors=${{ github.actor }}

      - name: Docker Image 빌드 및 Push
        env:
          # 스테이징용 NEXT_PUBLIC_* 값 묶음(.env 형식)
          FE_ENV: ${{ secrets.FE_ENV_STAGING }}
        run: |
          set -e

          if [ -z "$FE_ENV" ]; then
            echo "::error::FE_ENV_STAGING 시크릿이 없습니다."
            exit 1
          fi

          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAG_ARGS+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          LABEL_ARGS=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            LABEL_ARGS+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"

          docker buildx build \
            --push \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            --provenance=false \
            --sbom=false \
            --secret id=fe_env,env=FE_ENV \
            "${TAG_ARGS[@]}" \
            "${LABEL_ARGS[@]}" \
            ./ktb_agile_frontend

      - name: Record published image
        run: |
          digest=$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/image-metadata.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::이미지 digest를 확인하지 못했습니다"
            exit 1
          fi
          {
            printf '### staging 이미지 발행\n\n'
            printf '| 항목 | 값 |\n|---|---|\n'
            printf '| Git 태그 | `%s` |\n' "$GITHUB_REF_NAME"
            printf '| 소스 커밋 | `%s` |\n' "$GITHUB_SHA"
            printf '| 이미지 태그 | `ghcr.io/%s:%s` |\n' "${GITHUB_REPOSITORY,,}" "$GITHUB_REF_NAME"
            printf '| 배포용 이미지 | `ghcr.io/%s@%s` |\n' "${GITHUB_REPOSITORY,,}" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: staging 이미지 정리 (최신 3개만 유지)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: ktb4-1st-fe
          delete-tags: "staging-*"
          keep-n-tagged: 3
          delete-untagged: false
