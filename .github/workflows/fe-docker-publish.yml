name: FE Docker Image Publish

# Actions 목록에 커밋 메시지 대신 트리거한 브랜치/태그가 보이도록 지정
run-name: "Docker Publish: ${{ github.ref_name }} (${{ github.actor }})"

# dev push(merge): Docker Image 빌드 및 GHCR(100-hours-a-week 조직 소속 패키지) Push
#   - latest(로컬 테스트용 포인터), dev-<short SHA>(불변 추적용) 태그
# release tag(v*.*.*) push: 배포용 Docker Image 빌드 및 GHCR Push
#   - main으로 dev/hotfix가 merge된 뒤, 릴리즈 담당자가 해당 커밋에 Semantic Version 태그(예: v1.0.1)를 push하면 트리거됨
#   - Semantic Version 태그(v 접두어 제외)만 이미지 태그로 사용
on:
  push:
    branches:
      - dev
    tags:
      - "v*.*.*"
    paths:
      - "ktb_agile_frontend/**"
      - ".github/workflows/fe-docker-publish.yml"

# 동일 브랜치/태그에 연속 Push 발생 시 진행 중이던 이전 실행 자동 취소
concurrency:
  group: fe-docker-publish-${{ github.ref }} # dev에 push하면 refs/heads/dev, 태그 push하면 refs/tags/v1.0.1
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # github.repository는 "100-hours-a-week/KTB4-1st-FE" 형태(docker/metadata-action이 images 값을 자동으로 소문자 변환)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Docker Image 빌드 및 GHCR Push
    # ARM64 전용 GitHub Hosted 러너 사용
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 메타데이터(태그/라벨) 생성
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # dev          : latest(로컬 테스트용 포인터), dev-<short SHA>(불변 추적용)
          # release tag  : push된 태그(v1.0.1)에서 v를 뗀 Semantic Version을 그대로 태그로 사용
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.authors=${{ github.actor }}

      - name: Docker Image 빌드 및 Push
        id: build-push
        env:
          # 빌드 시 주입할 NEXT_PUBLIC_* 값 묶음(.env 형식). 브라우저에 노출되는 값만 넣을 것
          # dev 푸시(로컬 docker compose 테스트용 이미지)는 FE_ENV_DEV, 릴리즈 태그(운영 이미지)는 FE_ENV
          FE_ENV_DEV: ${{ secrets.FE_ENV_DEV }}
          FE_ENV_PROD: ${{ secrets.FE_ENV }}
        run: |
          set -e

          # 빌드 대상에 맞는 값 선택. 비어 있으면 다른 환경 값으로 빌드되지 않도록 중단
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            FE_ENV="$FE_ENV_DEV"; SECRET_NAME="FE_ENV_DEV"
          else
            FE_ENV="$FE_ENV_PROD"; SECRET_NAME="FE_ENV"
          fi
          if [ -z "$FE_ENV" ]; then
            echo "::error::${SECRET_NAME} 시크릿이 없습니다."
            exit 1
          fi
          export FE_ENV

          # 태그 변환
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAG_ARGS+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          # 라벨 변환
          LABEL_ARGS=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            LABEL_ARGS+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"

          # 이미지 빌드 + GHCR push
          # --provenance=false --sbom=false: 이미지 빌드 시 SBOM 생성 및 Provenance 서명 생성을 건너뜀(불필요한 증명서 생성 방지)
          # --secret: FE_ENV를 이미지 레이어에 남기지 않고 빌드 중에만 전달 (Dockerfile의 RUN --mount=type=secret,id=fe_env)
          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            --secret id=fe_env,env=FE_ENV \
            "${TAG_ARGS[@]}" \
            "${LABEL_ARGS[@]}" \
            ./ktb_agile_frontend

      - name: dev 이미지 정리 (최신 3개만 유지)
        if: github.ref == 'refs/heads/dev'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: ktb4-1st-fe
          delete-tags: "dev-*"
          keep-n-tagged: 3
          delete-untagged: true

      - name: main 배포 이미지 정리 (최신 5개만 유지)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: ktb4-1st-fe
          delete-tags: "*.*.*"
          keep-n-tagged: 5
          delete-untagged: true

      - name: Send Discord Notification
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '수동 실행' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1. 웹훅 URL 미등록 시 에러 없이 스킵
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured. Skipping notification."
            exit 0
          fi

          # 2. 빌드 결과 상태값 분기
          case "$JOB_STATUS" in
            success)
              COLOR=3066993
              STATUS_EMOJI="✅"
              STATUS_TEXT="성공"
              ;;
            failure)
              COLOR=15158332
              STATUS_EMOJI="🚨"
              STATUS_TEXT="실패"
              ;;
            *)
              COLOR=15105570
              STATUS_EMOJI="⚠️"
              STATUS_TEXT="취소됨"
              ;;
          esac

          # 3. 커밋 메시지 첫 줄만 사용하고 타임스탬프 생성
          FIRST_LINE_COMMIT_MSG=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          # 4. jq를 통한 안전한 JSON 직렬화
          jq -n \
            --arg title "${STATUS_EMOJI} [${WORKFLOW_NAME}] ${STATUS_TEXT}" \
            --argjson color "$COLOR" \
            --arg repo "\`${REPO_NAME}\`" \
            --arg ref "\`${REF_NAME}\`" \
            --arg actor "$ACTOR" \
            --arg commit "$FIRST_LINE_COMMIT_MSG" \
            --arg run_url "[GitHub Actions 실행 로그 바로가기](${RUN_URL})" \
            --arg time "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: $title,
                  color: $color,
                  fields: [
                    { name: "저장소", value: $repo, inline: true },
                    { name: "브랜치 / 태그", value: $ref, inline: true },
                    { name: "트리거 유저", value: $actor, inline: true },
                    { name: "커밋 메시지", value: $commit },
                    { name: "상세 로그", value: $run_url }
                  ],
                  footer: { text: "바꾸까 배포 알림" },
                  timestamp: $time
                }
              ]
            }' > payload.json

          # 5. Webhook 전송 (실패해도 워크플로우를 중단시키지 않음)
          curl -s -S --fail \
               -H "Content-Type: application/json" \
               -X POST \
               -d @payload.json \
               "$WEBHOOK_URL" || echo "::warning::Failed to deliver Discord notification."
